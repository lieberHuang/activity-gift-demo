<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的奖品</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; color:#17191e; background:#f7f7f7; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    .phone { min-height:100vh; max-width:430px; margin:auto; background:#fff; }
    .nav { height:88px; padding:39px 22px 0; display:grid; grid-template-columns:38px 1fr 112px; align-items:center; background:#fbfbfb; }
    .back { width:18px; height:18px; border-left:3px solid #444; border-bottom:3px solid #444; transform:rotate(45deg); }
    h1 { margin:0; text-align:center; font-size:23px; font-weight:800; }
    .menu { justify-self:end; width:112px; height:47px; padding:0 13px; border:1px solid #ededed; border-radius:25px; display:flex; align-items:center; justify-content:space-between; background:#fff; box-shadow:0 1px 4px #4d4d4d0d; }
    .dots { margin-top:-6px; font-size:20px; font-weight:900; letter-spacing:2px; }
    .divider { width:1px; height:25px; background:#e8e8e8; }
    .target { position:relative; width:25px; height:25px; border:3px solid #151515; border-radius:50%; }
    .target:after { content:""; position:absolute; top:6px; left:6px; width:7px; height:7px; border-radius:50%; background:#151515; }
    main { padding:40px 32px; }
    .prizes { overflow:hidden; border:1px solid #f0f0f0; border-radius:12px; box-shadow:0 2px 8px #00000008; }
    .section-title { padding:18px 0 12px; color:#1595f1; text-align:center; font-size:19px; font-weight:800; }
    .prize { position:relative; display:grid; grid-template-columns:88px 1fr auto; align-items:center; min-height:113px; padding:13px 0 13px 8px; border-bottom:2px solid #ededed; }
    .prize:last-child { border-bottom:0; }
    .icon { width:72px; height:72px; display:grid; place-items:center; border:2px solid #e1e1e1; border-radius:50%; color:#161616; font-size:35px; }
    .music-icon { color:#fff; font-size:34px; background:linear-gradient(145deg,#f24354,#bc112c); border:0; box-shadow:inset 0 0 0 5px #fff; }
    .detail h2 { margin:0 0 8px; font-size:20px; font-weight:700; }
    .detail p { margin:0; color:#9b9b9b; font-size:15px; white-space:nowrap; }
    .action { min-width:86px; margin:0 9px 0 6px; padding:11px 10px; border:0; border-radius:24px; color:#fff; text-align:center; text-decoration:none; font-size:17px; font-weight:700; background:#109cf3; }
    .claimed { color:#bdbdbd; background:transparent; }
    .empty-tip { margin:22px 0 0; color:#aaa; text-align:center; font-size:13px; }
    .toast { position:fixed; left:50%; top:50%; z-index:4; padding:13px 18px; border-radius:10px; color:#fff; background:#202020d9; transform:translate(-50%,-50%) scale(.92); opacity:0; transition:.2s; pointer-events:none; }
    .toast.show { transform:translate(-50%,-50%) scale(1); opacity:1; }
    @media (min-width:700px) { body { padding:22px 0; background:#f0f0f0; } .phone { min-height:calc(100vh - 44px); border-radius:28px; overflow:hidden; box-shadow:0 18px 55px #3333; } }
  </style>
</head>
<body>
  <div class="phone">
    <header class="nav"><a class="back" href="questionnaire-gift.html" aria-label="返回活动礼品页"></a><h1>我的奖品</h1><div class="menu"><span class="dots">•••</span><i class="divider"></i><i class="target"></i></div></header>
    <main>
      <section class="prizes"><h2 class="section-title">盲盒礼品</h2>
        <article class="prize"><div class="icon music-icon">♫</div><div class="detail"><h2>网易云音乐月卡</h2><p>有效期：2026.06.12 — 2026.07.19</p></div><button class="action" type="button" id="claim">领取</button></article>
        <article class="prize"><div class="icon">🎁</div><div class="detail"><h2>联名水杯</h2><p>有效期：2026.06.12 — 2026.07.19</p></div><span class="action claimed">已领取</span></article>
      </section><p class="empty-tip">奖品将在有效期内保留，请及时领取</p>
    </main>
  </div><div id="toast" class="toast" role="status">网易云音乐月卡已领取</div>
  <script>
    document.getElementById('claim').addEventListener('click', function () {
      this.outerHTML = '<span class="action claimed">已领取</span>';
      document.getElementById('toast').classList.add('show');
    });
  </script>
</body>
</html>
